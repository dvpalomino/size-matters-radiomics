# ============================================================
# PyRadiomics parameters - full global extraction - BraTS / MSD brain MRI
# Study: ROI-volume dependence of radiomic features.
#
# Features and images: 14 shape + 93 per image x 12 images
#   (original, LoG 2/3/5 mm, 8 wavelet sub-bands) = 1130 features per ROI.
# Notes:
#   - normalize: false. Intensity normalization is done by 01_extract.py BEFORE PyRadiomics:
#     z-score within the brain mask x 100 (same scale as normalize + normalizeScale 100,
#     but without the zero-valued skull-stripped background biasing mean and SD).
#   - No resampling: the data are already 1 mm isotropic and co-registered.
# ============================================================

imageType:
  Original: {}
  LoG:
    sigma: [2.0, 3.0, 5.0]
    binWidth: 2
  Wavelet:
    wavelet: coif1
    start_level: 0
    level: 1

featureClass:
  shape: []
  firstorder: []
  glcm: []
  glrlm: []
  glszm: []
  gldm: []
  ngtdm: []

setting:
  normalize: false           # already normalized (brain z-score x 100)
  voxelArrayShift: 0
  padDistance: 20
  preCrop: true
  binWidth: 5
  distances: [1]
  symmetricalGLCM: true
  force2D: false
  label: 1
  correctMask: true
  geometryTolerance: 0.001
  minimumROISize: 50
